{% extends "accounts/base_auth.html" %}
{% block title %}Changer de mot de passe — {{ SITE_NAME }}{% endblock %}
{% block auth_title %}Changer de mot de passe{% endblock %}

{% block auth_body %}
<form method="post" novalidate>
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="btn btn-primary w-100">Modifier le mot de passe</button>
</form>
{% endblock %}

{% block auth_footer %}
<p class="text-center mt-3"><a href="{% url 'accounts:account' %}">Annuler</a></p>
{% endblock %}
