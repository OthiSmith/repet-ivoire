<div class="accordion-item">
  <h3 class="accordion-header">
    <button class="accordion-button collapsed fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#faq-{{ id }}" aria-expanded="false" aria-controls="faq-{{ id }}">{{ question }}</button>
  </h3>
  <div id="faq-{{ id }}" class="accordion-collapse collapse" data-bs-parent="#{{ parent }}">
    <div class="accordion-body text-muted">{{ answer }}</div>
  </div>
</div>
