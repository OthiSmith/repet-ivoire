{# Courbe des notes d'une matière, ramenées sur 20. Repère pointillé = moyenne (10/20). Survol d'un point : détail. #}
<figure class="grade-chart mb-0">
  <figcaption class="d-flex justify-content-between small mb-1">
    <span class="fw-semibold">{{ chart.title }}</span>
    <span class="text-muted">Moyenne {{ chart.average|floatformat:"-2" }}/20 · dernière {{ chart.last.value|floatformat:"-2" }}/20</span>
  </figcaption>
  <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="Notes en {{ chart.title }} : {% for p in chart.points %}{{ p.label }}{% if not forloop.last %} ; {% endif %}{% endfor %}">
    {% for g in chart.gridlines %}
      <line x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ g.y|floatformat:'1u' }}" y2="{{ g.y|floatformat:'1u' }}" class="{% if g.is_average %}grid-average{% else %}grid{% endif %}"/>
      <text x="{{ chart.plot_left|add:'-6' }}" y="{{ g.y|floatformat:'1u' }}" class="axis-label" text-anchor="end" dominant-baseline="middle">{{ g.value }}</text>
    {% endfor %}
    {% if chart.points|length > 1 %}<polyline points="{{ chart.polyline }}" class="grade-line"/>{% endif %}
    {% for p in chart.points %}
      <g class="grade-point" tabindex="0">
        <title>{{ p.label }}</title>
        <circle cx="{{ p.x|floatformat:'1u' }}" cy="{{ p.y|floatformat:'1u' }}" r="12" class="hit"/>
        <circle cx="{{ p.x|floatformat:'1u' }}" cy="{{ p.y|floatformat:'1u' }}" r="4.5" class="dot"/>
      </g>
    {% endfor %}
    {% with last=chart.last %}
      <text x="{{ last.x|floatformat:'1u' }}" y="{{ last.y|floatformat:'1u' }}" dy="-10" text-anchor="middle" class="value-label">{{ last.value|floatformat:"-1" }}</text>
    {% endwith %}
  </svg>
</figure>
