{% extends "base.html" %}
{% block title %}Nouvelle demande — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width: 820px;">
    <a href="{% url 'tutoring:parent_dashboard' %}" class="d-inline-block mb-3"><i class="bi bi-arrow-left" aria-hidden="true"></i> Mon espace</a>
    <h1 class="h3 mb-1">Trouver un répétiteur</h1>
    <p class="text-muted mb-4">Plus votre demande est précise, plus nos propositions seront adaptées.</p>
    <form method="post" novalidate class="card p-4 p-lg-5">
      {% csrf_token %}
      {{ form }}
      <button type="submit" class="btn btn-accent">Envoyer ma demande</button>
    </form>
  </div>
</section>
{% endblock %}
